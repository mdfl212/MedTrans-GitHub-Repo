name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          if [ -d "Releases" ]; then
            find "Releases" -maxdepth 1 -type f -name "*.zip" -exec cp {} release-assets/ \;
          fi

          test -f ".github/skills/medtrans/SKILL.md"
          rm -f "release-assets/MedTrans_VSCode_Copilot_Skill.zip"
          (cd ".github/skills" && zip -qr "$GITHUB_WORKSPACE/release-assets/MedTrans_VSCode_Copilot_Skill.zip" "medtrans")

          ls -la release-assets

      - name: Upload release files to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
